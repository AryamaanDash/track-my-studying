name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-placeholder-secret-not-for-deployment

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      
      - run: npm ci
      - run: npm run db:generate
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Check migrations, production build, and browser flow
        run: npm run test:e2e
      - name: Upload browser test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
