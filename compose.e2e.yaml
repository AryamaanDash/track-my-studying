# Only used by scripts/run-e2e.mjs, with a unique project name per run.
# No persistent volumes or hosted credentials are used.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: study_e2e
      POSTGRES_USER: study_e2e
      POSTGRES_PASSWORD: disposable_e2e_password
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_e2e -d study_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
